  function inventRecipe(){

    else if(mode==='rice'){extras[0]='Rice';}

    if(mode==='pasta')steps=[`Cook dry pasta until tender, saving a little pasta water.`,`In a separate pan, cook the thawed ${mainLabel} with garlic. ${cook}`,`Add ${vegetableNames} and a splash of cream, milk or soft cheese. Simmer gently until vegetables are tender.`,`Toss with the pasta and enough cooking water to make a glossy sauce. Season to taste.`];
    if(mode==='wrap')steps=[`Slice or prepare thawed ${mainLabel}, and season with paprika, salt and pepper.`,`Pan-cook it thoroughly. ${cook}`,`Add ${vegetableNames} and fry or wilt until hot and tender.`,`Warm wraps, fill with the cooked mixture, and finish with a little yogurt or sauce.`];

    if(mode==='curry')steps=[`Cook rice separately. Warm oil and curry powder in a wide pan.`,`Add the thawed ${mainLabel} and cook it with a splash of water. ${cook}`,`Add chopped tomatoes or coconut milk plus ${vegetableNames}; simmer gently until the vegetables are tender and everything is thoroughly hot.`,`Taste, adjust the seasoning and spoon over rice.`];
    if(mode==='soup')steps=[`Warm some oil in a deep pot and cook chopped ${mainLabel} with any onions available.`,`Add stock, diced potatoes, ${vegetableNames} and a small pinch of lovage if included.`,`Simmer until the potatoes are tender and the ${mainLabel} is fully cooked. ${cook}`,`Season carefully and serve with bread if you like.`];

ion</button></div><div id="generated-results" class="generated">${generatedIds?generatedMarkup():`<div class="gen-placeholder"><span class="big">🍲</span><p>Get three recipe ideas — or invent a brand-new combination using your freezer stock.</p></div>`}</div><div class="tips"><strong>How this works</strong><br>Choose written recipes or invent a fresh combination from compatible freezer ingredients. Everything works offline — no AI account, subscription or internet required.</div>`;}
  function suggestionScore(r){let score=stockedCount(r)*6-stockMissing(r).length*10;const availableWeight=r.ingredients.reduce((sum,[id,n])=>sum+Math.min(stock(id)/Math.max(n,.001),3),0);score+=availableWeight*1.6;if(genMood==='quick')score+=r.minutes<=30?18:-8;if(genMood==='high')score+=r.tags.includes('High protein')?16:-2;if(genMood==='comfort')score+=['Special','Meat','Chicken'].includes(r.category)?8:0;if(genMood==='use')score+=r.tags.includes('Use it up')?12:0;if(genMood==='veg')score+=r.ingredients.filter(([id])=>item(id)?.zone==='Fruit & veg').length*6;score+=(Math.random()*7);return score;}
  function generateIdeas(){invented=null;let pool=RECIPES.filter(r=>(genMains==='any'||r.ingredients.some(([id])=>id===genMains))&&(genTime==='any'||r.minutes<=Number(genTime)));if(!pool.length){toast('No recipes meet those filters — try more time or another ingredient.');generatedIds=[];document.getElementById('generated-results').innerHTML=generatedMarkup();return;}generatedIds=pool.map(r=>({r,score:suggestionScore(r)})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.r.id);document.getElementById('generated-results').innerHTML=generatedMarkup();document.getElementById('generated-results').scrollIntoView({behavior:'smooth',block:'start'});}
  function generatedMarkup(){if(generatedIds?.includes('invented')&&invented)return `<div class="section-heading" style="margin-top:0"><h2>Your original creation ✨</h2><button class="text-btn" onclick="inventRecipe()">New combo ↻</button></div><div class="gen-highlight"><div class="kicker">🪄 Freshly invented</div><div style="font-size:44px;float:right">${invented.emoji}</div><h3>${esc(invented.title)}</h3><p>${esc(invented.description)}</p><div class="modal-meta" style="margin-bottom:13px"><span class="pill">⏱ ${invented.minutes} min</span><span class="pill">${invented.ingredients.length} freezer ingredients</span></div><button class="btn full" onclick="openRecipe('invented')">See ingredients & steps ${icon('arrow')}</button></div>`;if(!generatedIds?.length)return `<div class="gen-placeholder">No matches found. Broaden your choices.</div>`;const rs=generatedIds.map(id=>RECIPES.find(r=>r.id===id)).filter(Boolean);return `<div class="section-heading" style="margin-top:0"><h2>Made for tonight ✨</h2><button class="text-btn" onclick="generateIdeas()">Shuffle ↻</button></div><div class="recipe-grid">${recipeCards(rs)}</div><p class="foot-note">We favour recipes you can make with current freezer stock. Open a card to see any extra cupboard ingredients.</p>`;}
  function renderFreezer(){const all=items();let filtered=all.filter(i=>(zoneFilter==='All'||i.zone===zoneFilter)&&(!(!showOut&&i.qty<=0))&&(`${i.name} ${i.note} ${i.zone}`).toLowerCase().includes(freezerQuery.toLowerCase()));let html='';for(const zone of ZONES){const group=filtered.filter(i=>i.zone===zone);if(!group.length)continue;html+=`<div class="inventory-group"><div class="inventory-group-title"><h3>${zone}</h3><span class="small-note">${group.length} items</span></div><div class="inventory-list">${group.map(i=>`<div class="stock-row ${i.qty===0?'off':''}"><span class="stock-emoji">${esc(i.emoji)}</span><div style="flex:1;min-width:0;cursor:pointer" onclick="editItem('${i.id}')" title="Tap to edit"><div class="stock-name">${esc(i.name)}</div>${i.note?`<div class="stock-note">${esc(i.note)}</div>`:''}</div><div class="stock-right"><button class="mini-action" onclick="adjust('${i.id}',-1)" title="Use one unit" aria-label="Use ${esc(i.name)}">−</button><div class="stock-qty">${quantity(i.qty,i.unit)}</div><button class="mini-action plus" onclick="adjust('${i.id}',1)" title="Add one unit" aria-label="Add ${esc(i.name)}">+</button></div></div>`).join('')}</div></div>`;}
    document.getElementById('freezer').innerHTML=`<div class="welcome">EVERYTHING IN ITS PLACE</div><h1 class="page-title">Your freezer.</h1><p class="page-subtitle">${all.filter(x=>x.qty>0).length} ingredients in stock across ${ZONES.length} sections. Tap an ingredient to edit it.</p><div class="toolbar"><button class="btn sm" onclick="addItem()">${icon('plus')} Add ingredient</button><button class="btn sm outline" onclick="openManage()">Backup & share</button></div><div class="search">${icon('search')}<input id="freezer-search" placeholder="Search freezer contents..." value="${esc(freezerQuery)}" oninput="freezerQuery=this.value;renderFreezerRows()" aria-label="Search freezer" /></div><div class="chips" id="freezer-chips">${['All',...ZONES].map(z=>`<button class="chip ${zoneFilter===z?'active':''}" onclick="zoneFilter='${z}';renderFreezer()">${z}</button>`).join('')}</div><div class="toolbar"><label class="small-note" style="display:flex;gap:7px;align-items:center"><input type="checkbox" ${showOut?'checked':''} onchange="showOut=this.checked;renderFreezer()" /> Show out-of-stock</label><span class="small-note">− / + adjusts stock</span></div><div id="freezer-rows">${html||`<div class="empty"><span class="big">🧊</span><strong>Nothing here</strong><p>Try changing the filter.</p></div>`}</div><p class="foot-note">For food measured in kilograms, ± adjusts by 100 g. Packs and pieces adjust by 1; partial items by ¼. You can always tap an item to enter an exact amount.</p>`;}
  function renderFreezerRows(){const el=document.getElementById('freezer-search');let pos=el?.selectionStart??0;renderFreezer();const newEl=document.getElementById('freezer-search');newEl.focus();try{newEl.setSelectionRange(pos,pos);}catch(e){}}
  function adjust(id,direction){const i=item(id);if(!i)return;const step=i.unit==='kg'?.1:['bag','loaf','tub','pack','block','pieces'].includes(i.unit)&&['cheddar','butter','pineapple','big_bread','vanilla_ice_cream'].includes(id)?.25:1;const next=Math.max(0,Math.round((stock(id)+direction*step)*1000)/1000);state.stock[id]=next;save();render();}
  function renderPlan(){document.getElementById('plan').innerHTML=`<div class="welcome">A WEEK OF GOOD FOOD</div><h1 class="page-title">The meal plan.</h1><p class="page-subtitle">Add a dinner for each day. It's a flexible list — nothing is locked in.</p><div class="plan-box">${DAYS.map((d,ix)=>{const id=state.plan[ix];const r=RECIPES.find(r=>r.id===id);return `<div class="plan-row"><span class="day">${d}</span><div class="plan-meal ${!r?'empty-plan':''}" ${r?`onclick="openRecipe('${r.id}')" style="cursor:pointer"`:''}>${r?`${r.emoji} ${esc(r.title)}`:'No meal planned'}</div>${r?`<button class="mini-action" title="Remove meal" onclick="state.plan[${ix}]=null;save();renderPlan()">×</button>`:''}<button class="plan-select" title="Choose a meal" onclick="openPlanPicker(${ix})">${r?'↻':'+'}</button></div>`}).join('')}</div><div class="section-heading"><h2>Already saved</h2><button class="text-btn" onclick="recipeCat='Saved';switchTab('recipes')">All saved →</button></div>${state.favorites.length?`<div class="recipe-grid">${recipeCards(state.favorites.map(id=>RECIPES.find(r=>r.id===id)).filter(Boolean).slice(0,4))}</div>`:`<div class="empty"><span class="big">♡</span><strong>No saved recipes yet</strong><p>Tap a heart on a recipe to keep it here.</p></div>`}<div class="tips"><strong>🗓️ Meal planning tip</strong><br>Choose your dinners before shopping, then open each recipe to check what you already have and which extras you might need.</div>`;}
  function render(){if(tab==='home')renderHome();else if(tab==='recipes')renderRecipes();else if(tab==='create')renderCreate();else if(tab==='freezer')renderFreezer();else if(tab==='plan')renderPlan();}
  function switchTab(next){tab=next;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===next));document.querySelectorAll('.nav-item').forEach(n=>{n.classList.toggle('active',n.dataset.tab===next);n.setAttribute('aria-current',n.dataset.tab===next?'page':'false');});render();scrollTo({top:0,behavior:'smooth'});}
  function toggleFav(id){const idx=state.favorites.indexOf(id);if(idx===-1){state.favorites.push(id);toast('Saved to favourites ♡');}else{state.favorites.splice(idx,1);toast('Removed from favourites');}save();render();}
  function showModal(content){const layer=document.getElementById('modal-layer');document.getElementById('modal').innerHTML=`<div class="modal-top"><div class="drag"></div><button class="close-btn" onclick="closeModal()" aria-label="Close dialog">${icon('close')}</button></div>${content}`;layer.classList.add('open');document.body.style.overflow='hidden';document.getElementById('modal').scrollTop=0;}
  function closeModal(){document.getElementById('modal-layer').classList.remove('open');document.body.style.overflow='';}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  function openRecipe(id){const r=id==='invented'?invented:RECIPES.find(r=>r.id===id);if(!r)return;const ready=stockReady(r);const ingredientRows=r.ingredients.map(([key,n])=>{const i=item(key);const enough=stock(key)+.00001>=n;return `<li><span><span class="status-dot ${enough?'':'missing'}"></span>${esc(i?.name||key)}</span><span style="font-weight:800;white-space:nowrap;color:${enough?'#3c6950':'#a26b3a'}">${quantity(n,i?.unit||'pieces')}${enough?'':' ⚠'}</span></li>`;}).join('');showModal(`<div class="modal-art" style="${artStyle(r.category)}">${r.emoji}</div><div class="eyebrow">${esc(r.category)} · NIKOLA'S RECIPE BOOK</div><h2>${esc(r.title)}</h2><p>${esc(r.description)}</p><div class="modal-meta"><span class="pill">⏱ ${r.minutes} minutes</span><span class="pill">👩‍🍳 ${r.servings} servings</span><span class="pill ${ready?'':'warning'}">${ready?'✓ Freezer ingredients ready':'⚠ Missing freezer items'}</span></div><h3>From your freezer</h3><ul class="modal-list">${ingredientRows}</ul>${r.extras.length?`<h3>Check your cupboards / shopping list</h3><ul class="modal-list">${r.extras.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<h3>Let's cook</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="modal-actions">${r.original?`<button class="btn berry" onclick="saveInvented()">♡ Save this new recipe</button>`:`<button class="btn outline" onclick="toggleFav('${id}');openRecipe('${id}')">${state.favorites.includes(id)?'♥ Saved':'♡ Save'}</button><button class="btn outline" onclick="openPlanPicker(null,'${id}')">${icon('plus')} Meal plan</button>`}</div><button class="btn full ${ready?'':'ghost'}" ${ready?`onclick="cookRecipe('${id}')"`:'disabled'}>${ready?'✓ Cooked it · use ingredients':'Not enough freezer ingredients'}</button><p class="foot-note">Cooking subtracts the listed freezer quantities only after you confirm. Check packaging for cook-from-frozen instructions; otherwise thaw raw meat and fish safely in the fridge.</p>`);}
  function cookRecipe(id){const r=id==='invented'?invented:RECIPES.find(x=>x.id===id);if(!r||!stockReady(r))return;if(!confirm(`Mark “${r.title}” as cooked and subtract its freezer ingredients?`))return;for(const [key,n] of r.ingredients)state.stock[key]=Math.max(0,Math.round((stock(key)-n)*1000)/1000);state.history.unshift({id,date:new Date().toISOString()});state.history=state.history.slice(0,50);const plannedIndex=state.plan.indexOf(id);if(plannedIndex!==-1)state.plan[plannedIndex]=null;save();closeModal();render();toast(`Enjoy! Ingredients used for ${r.title} ✓`);}
  function openPlanPicker(day,selectedId=null){const recipes=[...RECIPES].sort((a,b)=>(Number(stockReady(b))-Number(stockReady(a)))||(a.title.localeCompare(b.title)));showModal(`<div class="eyebrow">THE WEEKLY PLAN</div><h2>${day==null?'Choose a day':'Choose a meal for '+DAYS[day]}</h2><p>Pick from your recipe book. Stocked options come first.</p>${day==null?`<div class="field"><label for="plan-day">Day</label><select id="plan-day">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div><button class="btn full" style="margin-top:12px" onclick="addPlan('${selectedId||''}')">Add to plan</button>`:`<div class="inventory-list">${recipes.map(r=>`<div class="stock-row" style="cursor:pointer" onclick="setPlan(${day},'${r.id}')"><span class="stock-emoji">${r.emoji}</span><div style="flex:1"><div class="stock-name">${esc(r.title)}</div><div class="stock-note">${r.minutes} min · ${stockReady(r)?'Freezer items ready':'Some ingredients missing'}</div></div><span style="color:var(--forest)">+</span></div>`).join('')}</div>`}`);}
  function addPlan(id){const sel=document.getElementById('plan-day');const day=Number(sel?.value);if(!id||day<0||day>6)return;setPlan(day,id);}
  function setPlan(day,id){state.plan[day]=id;save();closeModal();render();toast(`Added to ${DAYS[day]}'s plan`);}
  function itemEditorData(id){return id?item(id):{id:'',name:'',qty:1,unit:'pieces',zone:'Misc & ready meals',emoji:'🧊',note:''};}
  function addItem(){editItem(null);}
  function editItem(id){const i=itemEditorData(id);if(!i)return;const options=['kg','pieces','packs','portions','bag','tub','loaf','block','rolls','balls','halves','cakes','buns','baps','bird','rabbit','burgers','baguettes','half'];showModal(`<div class="eyebrow">FREEZER INVENTORY</div><h2>${id?'Edit ingredient':'Add an ingredient'}</h2><p>Keep the quantity, location and description up to date.</p><form class="stock-editor" onsubmit="event.preventDefault();saveItem('${id||''}')"><div class="field"><label for="edit-name">Ingredient name</label><input id="edit-name" value="${esc(i.name)}" required maxlength="90" /></div><div class="field-row"><div class="field"><label for="edit-qty">Quantity</label><input id="edit-qty" type="number" step="0.01" min="0" max="100000" value="${i.qty}" required /></div><div class="field"><label for="edit-unit">Unit</label><select id="edit-unit">${[...new Set([i.unit,...options])].map(u=>`<option value="${esc(u)}" ${u===i.unit?'selected':''}>${esc(u)}</option>`).join('')}</select></div></div><div class="field"><label for="edit-zone">Freezer section</label><select id="edit-zone">${ZONES.map(z=>`<option ${i.zone===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label for="edit-note">Notes (optional)</label><textarea id="edit-note" maxlength="250">${esc(i.note)}</textarea></div><button class="btn full" type="submit">Save ingredient ${icon('check')}</button>${id&&state.custom.some(x=>x.id===id)?`<button class="btn outline full" type="button" onclick="deleteItem('${id}')">Remove this ingredient</button>`:''}</form>`);}
  function saveItem(id){const name=document.getElementById('edit-name').value.trim(),qty=Number(document.getElementById('edit-qty').value),unit=document.getElementById('edit-unit').value,zone=document.getElementById('edit-zone').value,note=document.getElementById('edit-note').value.trim();if(!name||!Number.isFinite(qty)||qty<0||qty>100000||!ZONES.includes(zone))return toast('Please enter a valid ingredient and quantity.');if(!id){id='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);state.custom.push({id,name,qty,unit,zone,emoji:'🧊',note});}else{const target=state.custom.find(x=>x.id===id)||SEED_ITEMS.find(x=>x.id===id);if(!target)return;target.name=name;target.unit=unit;target.zone=zone;target.note=note;if(!state.custom.find(x=>x.id===id)){/* Save edits to seeded metadata without changing source catalog on reload. */ state.meta=state.meta||{};state.meta[id]={name,unit,zone,note};}else{Object.assign(target,{name,unit,zone,note});}}state.stock[id]=Math.round(qty*1000)/1000;save();closeModal();render();toast('Ingredient saved ✓');}
  function deleteItem(id){if(!confirm('Remove this custom ingredient permanently?'))return;state.custom=state.custom.filter(x=>x.id!==id);delete state.stock[id];save();closeModal();render();toast('Ingredient removed');}
  function openManage(){showModal(`<div class="eyebrow">KEEP YOUR KITCHEN ORGANISED</div><h2>Your data & sharing</h2><p>Your inventory, favourites and meal plan are saved automatically on this device. No account or internet needed.</p><div class="settings-grid"><button class="manage-btn" onclick="exportData()"><span>📤</span>Export backup</button><button class="manage-btn" onclick="document.getElementById('import-input').click()"><span>📥</span>Import backup</button></div><h3>Sharing with another phone</h3><p>Export a JSON backup, send the file to the other phone, and import it there. This is a manual transfer — devices do not sync automatically.</p><div class="rule"></div><h3>Starting over</h3><button class="btn outline full" onclick="resetData()">Restore original freezer inventory</button><p class="foot-note">Restoring resets stock, plans and favourites. Importing replaces this device's saved data. Export first if you want a backup.</p>`);}
  function exportData(){const blob=new Blob([JSON.stringify({app:'NikolasKitchen',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nikolas-kitchen-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded ✓');}
  document.getElementById('import-input').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const parsed=JSON.parse(await f.text());const data=parsed?.app==='NikolasKitchen'?parsed.data:parsed;if(!data||typeof data.stock!=='object'||Array.isArray(data.stock)||!data.stock)throw Error('Invalid backup');if(!confirm('Import this backup? It will replace the inventory and plan saved on this device.'))return;const next=freshState();for(const [k,v] of Object.entries(data.stock)){if(typeof k==='string'&&k.length<150&&typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100000)next.stock[k]=v;}next.custom=Array.isArray(data.custom)?data.custom.filter(x=>x&&typeof x.id==='string'&&x.id.startsWith('custom_')&&typeof x.name==='string'&&x.name.length<=90&&ZONES.includes(x.zone)&&typeof x.unit==='string').slice(0,300).map(x=>({...x,emoji:'🧊'})):[];next.favorites=Array.isArray(data.favorites)?data.favorites.filter(id=>RECIPES.some(r=>r.id===id)):[];next.plan=Array.isArray(data.plan)&&data.plan.length===7?data.plan.map(id=>RECIPES.some(r=>r.id===id)?id:null):Array(7).fill(null);next.history=Array.isArray(data.history)?data.history.slice(0,50):[];next.creations=Array.isArray(data.creations)?data.creations.slice(0,150):[];next.meta=(data.meta&&typeof data.meta==='object'&&!Array.isArray(data.meta))?data.meta:{};state=next;syncCreations();applyMeta();save();closeModal();render();toast('Backup imported ✓');}catch(err){toast('That file is not a valid kitchen backup.');}});
  function resetData(){if(!confirm('Restore original freezer inventory? This clears every stock change, added item, favourite and meal plan.'))return;state=freshState();syncCreations();resetMeta();save();closeModal();render();toast('Original inventory restored');}
  // Apply saved edits to the bundled inventory. These edits remain private to this browser.
  const ORIGINAL_META=Object.fromEntries(SEED_ITEMS.map(i=>[i.id,{name:i.name,unit:i.unit,zone:i.zone,note:i.note}]));
  function resetMeta(){for(const i of SEED_ITEMS)Object.assign(i,ORIGINAL_META[i.id]);}
  function applyMeta(){resetMeta();if(!state.meta)return;for(const i of SEED_ITEMS){const m=state.meta[i.id];if(m&&typeof m==='object'){if(typeof m.name==='string'&&m.name.length<100)i.name=m.name;if(typeof m.unit==='string')i.unit=m.unit;if(ZONES.includes(m.zone))i.zone=m.zone;if(typeof m.note==='string')i.note=m.note;}}}
  applyMeta();render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  </script>
