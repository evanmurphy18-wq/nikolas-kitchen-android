  function guessExtra(raw){const x=String(raw||'').toLowerCase();if(/optional|or your|if you have|as desired|to taste| or |\/|spices or/.test(x))return null;

  R('roast-chicken','Sunday roast chicken','🍗','Chicken',90,4,[['whole_chicken',1],['peas',.25],['cauliflower',.35],['yorkshire',4]],['Potatoes','Gravy','Oil, salt and pepper'],['Thaw the chicken fully in the fridge if frozen. Heat the oven to 190°C fan.','Season the chicken, roast until the thickest part reaches 75°C, then rest for 15 minutes. Time depends on bird size.','Roast or boil potatoes; cook the cauliflower and peas.','Heat Yorkshire puddings as directed and serve with gravy.'],'A proper Sunday dinner, with leftovers for lunch.',['Family']);

    if(mode==='pasta')steps=[`Cook dry pasta until tender, saving a little pasta water.`,`In a separate pan, cook the thawed ${mainLabel} with garlic. ${cook}`,`Add ${vegetableNames} and a splash of cream, milk or soft cheese. Simmer gently until vegetables are tender.`,`Toss with the pasta and enough cooking water to make a glossy sauce. Season to taste.`];
    if(mode==='wrap')steps=[`Slice or prepare thawed ${mainLabel}, and season with paprika, salt and pepper.`,`Pan-cook it thoroughly. ${cook}`,`Add ${vegetableNames} and fry or wilt until hot and tender.`,`Warm wraps, fill with the cooked mixture, and finish with a little yogurt or sauce.`];

    if(mode==='soup')steps=[`Warm some oil in a deep pot and cook chopped ${mainLabel} with any onions available.`,`Add stock, diced potatoes, ${vegetableNames} and a small pinch of lovage if included.`,`Simmer until the potatoes are tender and the ${mainLabel} is fully cooked. ${cook}`,`Season carefully and serve with bread if you like.`];
    invented={id:'invented',title:name,emoji:style.emoji,category:kind==='fish'||kind==='prawn'?'Fish':kind==='chicken'?'Chicken':'Special',minutes:style.time,servings:2,ingredients:recipeIngredients,extras,steps,description:`A fresh ${style.label} idea assembled from ingredients in your freezer.`,tags:['Original combination'],original:true};

  function inventPantryRecipe(mainId,mainLabel,amount,kind){

  function saveInvented(){if(!invented)return;const saved={...invented,id:'made_'+Date.now(),original:false,custom:true};state.creations=state.creations||[];state.creations.push(saved);state.favorites.push(saved.id);syncCreations();save();invented=saved;generatedIds=[saved.id];closeModal();render();toast('Original recipe saved to your favourites ♡');}
  function syncCreations(){for(let i=RECIPES.length-1;i>=0;i--)if(RECIPES[i].custom)RECIPES.splice(i,1);for(const r of state.creations||[]){if(r&&/^made_[0-9]+$/.test(r.id)&&typeof r.title==='string'&&r.title.length<150&&Array.isArray(r.ingredients)&&r.ingredients.length<20&&Array.isArray(r.extras)&&Array.isArray(r.steps)&&r.steps.length<20)RECIPES.push(r);}}

  function renderCreate(){document.getElementById('create').innerHTML=`<div class="welcome">LET'S MAKE SOMETHING</div><h1 class="page-title">What shall we cook?</h1><p class="page-subtitle">Give me a few hints and I'll find the best matches from your whole kitchen.</p><div class="generator"><div class="kicker">✨ Dinner idea generator</div><h2>Let's make something good.</h2><p>Choose a main ingredient and a mood, or leave it to chance.</p><div class="field-row"><div class="field"><label for="gen-main">Main ingredient</label><select id="gen-main" onchange="genMains=this.value">${mainChoices().map(([id,n])=>`<option value="${id}" ${genMains===id?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label for="gen-mood">I'm in the mood for...</label><select id="gen-mood" onchange="genMood=this.value"><option value="any" ${genMood==='any'?'selected':''}>Anything delicious</option><option value="quick" ${genMood==='quick'?'selected':''}>Quick and easy</option><option value="high" ${genMood==='high'?'selected':''}>High-protein</option><option value="comfort" ${genMood==='comfort'?'selected':''}>Cosy comfort food</option><option value="use" ${genMood==='use'?'selected':''}>Using up what we have</option><option value="veg" ${genMood==='veg'?'selected':''}>Lots of vegetables</option></select></div></div><div class="field" style="margin:12px 0 16px"><label for="gen-time">Time available</label><select id="gen-time" onchange="genTime=this.value"><option value="any" ${genTime==='any'?'selected':''}>No limit</option><option value="25" ${genTime==='25'?'selected':''}>25 minutes or less</option><option value="45" ${genTime==='45'?'selected':''}>45 minutes or less</option><option value="75" ${genTime==='75'?'selected':''}>75 minutes or less</option></select></div><button class="btn full" onclick="generateIdeas()">✨ Find 3 written recipes ${icon('arrow')}</button><button class="btn full outline" style="margin-top:9px" onclick="inventRecipe()">🪄 Invent a new combination</button></div><div id="generated-results" class="generated">${generatedIds?generatedMarkup():`<div class="gen-placeholder"><span class="big">🍲</span><p>Get three recipe ideas — or invent a brand-new combination from your kitchen.</p></div>`}</div><div class="tips"><strong>How this works</strong><br>Choose written recipes or invent a fresh combination from compatible ingredients around the kitchen. Everything works offline — no AI account, subscription or internet required.</div>`;}
  function suggestionScore(r){let score=stockedCount(r)*6-stockMissing(r).length*10;const availableWeight=r.ingredients.reduce((sum,[id,n])=>{const need=requiredStock(r,id,n);return sum+(need===null?0:Math.min(stock(id)/Math.max(need,.001),3));},0);score+=availableWeight*1.6;if(genMood==='quick')score+=r.minutes<=30?18:-8;if(genMood==='high')score+=r.tags.includes('High protein')?16:-2;if(genMood==='comfort')score+=['Special','Meat','Chicken'].includes(r.category)?8:0;if(genMood==='use')score+=r.tags.includes('Use it up')?12:0;if(genMood==='veg')score+=r.ingredients.filter(([id])=>item(id)?.zone==='Fruit & veg').length*6;score+=(Math.random()*7);return score;}
  function generateIdeas(){invented=null;let pool=RECIPES.filter(r=>(genMains==='any'||r.ingredients.some(([id])=>id===genMains))&&(genTime==='any'||r.minutes<=Number(genTime)));if(!pool.length){toast('No recipes meet those filters — try more time or another ingredient.');generatedIds=[];document.getElementById('generated-results').innerHTML=generatedMarkup();return;}generatedIds=pool.map(r=>({r,score:suggestionScore(r)})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.r.id);document.getElementById('generated-results').innerHTML=generatedMarkup();document.getElementById('generated-results').scrollIntoView({behavior:'smooth',block:'start'});}
  function generatedMarkup(){if(generatedIds?.includes('invented')&&invented)return `<div class="section-heading" style="margin-top:0"><h2>Your original creation ✨</h2><button class="text-btn" onclick="inventRecipe()">New combo ↻</button></div><div class="gen-highlight"><div class="kicker">🪄 Freshly invented</div><div style="font-size:44px;float:right">${invented.emoji}</div><h3>${esc(invented.title)}</h3><p>${esc(invented.description)}</p><div class="modal-meta" style="margin-bottom:13px"><span class="pill">⏱ ${invented.minutes} min</span><span class="pill">${invented.ingredients.length} recorded ingredients</span></div><button class="btn full" onclick="openRecipe('invented')">See ingredients & steps ${icon('arrow')}</button></div>`;if(!generatedIds?.length)return `<div class="gen-placeholder">No matches found. Broaden your choices.</div>`;const rs=generatedIds.map(id=>RECIPES.find(r=>r.id===id)).filter(Boolean);return `<div class="section-heading" style="margin-top:0"><h2>Made for tonight ✨</h2><button class="text-btn" onclick="generateIdeas()">Shuffle ↻</button></div><div class="recipe-grid">${recipeCards(rs)}</div><p class="foot-note">We favour recipes you can make with current stocked ingredients. Open a card to check cupboard extras.</p>`;}
  function renderFreezer(){const all=items(),active=all.filter(i=>i.qty>0),zones=locationFilter==='All'?LOCATIONS:[locationFilter],search=freezerQuery.trim().toLowerCase();let filtered=all.filter(i=>(locationFilter==='All'||i.location===locationFilter)&&(zoneFilter==='All'||i.zone===zoneFilter)&&(showOut||i.qty>0)&&(!onlySoon||!!expiryStatus(i))&&(`${i.name} ${i.note} ${i.zone} ${i.location}`).toLowerCase().includes(search));
    let html='';for(const loc of zones){const byPlace=filtered.filter(i=>i.location===loc);if(!byPlace.length)continue;html+=`<div class="place-heading">${{Freezer:'🧊',Fridge:'🥛',Pantry:'🫙',Counter:'🍎',Other:'📦'}[loc]} ${loc}<span>${byPlace.length}</span></div>`;
      for(const zone of zoneOptions(loc)){const group=byPlace.filter(i=>i.zone===zone);if(!group.length)continue;html+=`<div class="inventory-group"><div class="inventory-group-title"><h3>${esc(zone)}</h3><span class="small-note">${group.length} items</span></div><div class="inventory-list">${group.map(i=>{const due=expiryStatus(i);return `<div class="stock-row ${i.qty===0?'off':''}"><span class="stock-emoji">${esc(i.emoji)}</span><div class="stock-detail" onclick="editItem('${i.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')editItem('${i.id}')"><div class="stock-name">${esc(i.name)}</div><div class="stock-note">${i.note?esc(i.note)+' · ':''}${i.bestBefore?'Date '+esc(i.bestBefore):esc(i.location)}</div>${due?`<div class="due-label">⚑ ${due}</div>`:''}</div><div class="stock-right"><button class="mini-action" onclick="adjust('${i.id}',-1)" aria-label="Use ${esc(i.name)}">−</button><div class="stock-qty">${quantity(i.qty,i.unit)}</div><button class="mini-action plus" onclick="adjust('${i.id}',1)" aria-label="Add ${esc(i.name)}">+</button></div></div>`}).join('')}</div></div>`;}
    }

    document.getElementById('freezer').innerHTML=`<div class="welcome">EVERYTHING IN ITS PLACE</div><h1 class="page-title">Your kitchen.</h1><p class="page-subtitle">${active.length} foods recorded in the house. Add what you actually own — nothing is assumed.</p><div class="toolbar"><button class="btn sm" onclick="addItem()">${icon('plus')} Add food</button><button class="btn sm outline" onclick="openEssentials()">🧺 Common foods</button><button class="btn sm outline" onclick="openManage()">⚙ Backup</button><button class="btn sm outline" onclick="openShopping()">🛒 Shopping</button></div><div class="search">${icon('search')}<input id="freezer-search" placeholder="Search all ingredients..." value="${esc(freezerQuery)}" oninput="freezerQuery=this.value;renderFreezerRows()" aria-label="Search kitchen inventory" /></div><div class="chips">${['All',...LOCATIONS].map(loc=>`<button class="chip ${locationFilter===loc?'active':''}" onclick="locationFilter='${loc}';zoneFilter='All';renderFreezer()">${loc==='All'?'🏠 All':loc==='Freezer'?'🧊 Freezer':loc==='Fridge'?'🥛 Fridge':loc==='Pantry'?'🫙 Pantry':loc==='Counter'?'🍎 Counter':'📦 Other'}</button>`).join('')}</div><div class="toolbar"><label class="small-note" style="display:flex;gap:7px;align-items:center"><input type="checkbox" ${showOut?'checked':''} onchange="showOut=this.checked;renderFreezer()"/> Show empty items</label><button class="text-btn" onclick="onlySoon=!onlySoon;renderFreezer()">${onlySoon?'✓ Dates to check':'📅 Use soon'}</button></div><div id="freezer-rows">${html||`<div class="empty"><span class="big">🧺</span><strong>${search?'No matching foods':'Nothing in this area yet'}</strong><p>Try Common foods or Add food to get started.</p></div>`}</div><p class="foot-note">Tap a food to choose its icon, use custom units, adjust its amount or update its storage and dates. + and − make quick stock changes. Dates are reminders to check the label, not a guarantee of food safety.</p>`;
  }
  function renderFreezerRows(){const input=document.getElementById('freezer-search'),pos=input?.selectionStart??0;renderFreezer();const next=document.getElementById('freezer-search');next.focus();try{next.setSelectionRange(pos,pos);}catch(e){}}
  function adjust(id,direction){const i=item(id);if(!i)return;const step=Number(i.step)>0?Number(i.step):unitDefaultStep(i.unit);state.stock[id]=Math.max(0,Math.round((stock(id)+direction*step)*10000)/10000);save();render();}
  function openEssentials(query=''){const matches=matchingEssentials(query).sort((a,b)=>Number(stock(b.id)>0)-Number(stock(a.id)>0)||a.name.localeCompare(b.name));showModal(`<div class="eyebrow">QUICK-ADD SHELF</div><h2>Common household foods</h2><p>These start at zero. Choose what you have and enter the amount. Your own items can be added too.</p><div class="search">${icon('search')}<input id="essentials-search" placeholder="Find rice, eggs, oil, oats..." value="${esc(query)}" oninput="filterEssentials(this.value)" /></div><div id="essentials-list" class="essential-list">${essentialRows(matches)}</div><button class="btn full outline" onclick="addItem()">+ Add something different</button>`);}
  function essentialRows(arr){return arr.map(i=>`<button class="essential-row" onclick="editItem('${i.id}')"><span class="stock-emoji">${esc(i.emoji)}</span><span><b>${esc(i.name)}</b><small>${esc(i.location)} · ${stock(i.id)>0?quantity(stock(i.id),i.unit):'Not added'}</small></span><strong>${stock(i.id)>0?'Edit':'+ Add'}</strong></button>`).join('')||'<p class="small-note">No match. Use Add something different.</p>';}
  function matchingEssentials(query){const q=query.trim().toLowerCase();if(!q)return [...STARTER_ITEMS];const byName=STARTER_ITEMS.filter(i=>i.name.toLowerCase().includes(q));return byName.length?byName:STARTER_ITEMS.filter(i=>(i.zone+' '+i.location).toLowerCase().includes(q));}

  function renderPlan(){document.getElementById('plan').innerHTML=`<div class="welcome">A WEEK OF GOOD FOOD</div><h1 class="page-title">The meal plan.</h1><p class="page-subtitle">Add a dinner for each day. It's a flexible list — nothing is locked in.</p><div class="plan-box">${DAYS.map((d,ix)=>{const id=state.plan[ix];const r=RECIPES.find(r=>r.id===id);return `<div class="plan-row"><span class="day">${d}</span><div class="plan-meal ${!r?'empty-plan':''}" ${r?`onclick="openRecipe('${r.id}')" style="cursor:pointer"`:''}>${r?`${r.emoji} ${esc(r.title)}`:'No meal planned'}</div>${r?`<button class="mini-action" title="Remove meal" onclick="state.plan[${ix}]=null;save();renderPlan()">×</button>`:''}<button class="plan-select" title="Choose a meal" onclick="openPlanPicker(${ix})">${r?'↻':'+'}</button></div>`}).join('')}</div><div class="section-heading"><h2>Already saved</h2><button class="text-btn" onclick="recipeCat='Saved';switchTab('recipes')">All saved →</button></div>${state.favorites.length?`<div class="recipe-grid">${recipeCards(state.favorites.map(id=>RECIPES.find(r=>r.id===id)).filter(Boolean).slice(0,4))}</div>`:`<div class="empty"><span class="big">♡</span><strong>No saved recipes yet</strong><p>Tap a heart on a recipe to keep it here.</p></div>`}<div class="tips"><strong>🗓️ Meal planning tip</strong><br>Choose your dinners before shopping, then open each recipe to check what you already have and which extras you might need.</div>`;}
  function render(){if(tab==='home')renderHome();else if(tab==='recipes')renderRecipes();else if(tab==='create')renderCreate();else if(tab==='freezer')renderFreezer();else if(tab==='plan')renderPlan();}

  function showModal(content){window.NK_SHOPPING_OPEN=false;const layer=document.getElementById('modal-layer');document.getElementById('modal').innerHTML=`<div class="modal-top"><div class="drag"></div><button class="close-btn" onclick="closeModal()" aria-label="Close dialog">${icon('close')}</button></div>${content}`;layer.classList.add('open');document.body.style.overflow='hidden';document.getElementById('modal').scrollTop=0;}

  function openRecipe(id){const r=id==='invented'?invented:RECIPES.find(x=>x.id===id);if(!r)return;const ready=stockReady(r);const ingredientRows=r.ingredients.map(([key,n])=>{const i=item(key);if(!i)return '';const need=requiredStock(r,key,n),enough=recipeEnough(r,key,n);const source=recipeUnitFor(r,key);const requirement=quantity(n,source);const hasConverted=need!==null&&source!==i.unit;return `<li><span>${esc(i.emoji)} ${esc(i.name)} <small class="small-note">· ${esc(i.location)}</small></span><span class="amount ${enough?'':'missing'}">${esc(requirement)}${hasConverted?`<small class="small-note"> · ${esc(quantity(need,i.unit))} stock</small>`:''} ${need===null?'· set unit equivalent':enough?'✓':'· missing'}</span></li>`}).join('');const extras=r.extras.map(raw=>{const e=extraStatus(raw);return `<li><span>${esc(raw)}</span><span class="amount ${!e||!e.available?'missing':''}">${e?(e.available?(e.quantityKnown?'✓ Enough listed':'✓ Stocked'):'Need'):'Check'} <button class="extra-shop" title="Add to shopping list" onclick="addShoppingExtra('${r.id}',${r.extras.indexOf(raw)})">+</button></span></li>`}).join('');const needed=r.extras.filter(raw=>{const e=extraStatus(raw);return !e||!e.available;}).length;
    showModal(`<div class="modal-recipe-visual" style="${artStyle(r.category)}">${r.emoji}</div><div class="eyebrow">${esc(r.category)} · ${r.minutes} min</div><h2>${esc(r.title)}</h2><p>${esc(r.description)}</p><div class="modal-meta"><span class="pill">👥 ${r.servings} servings</span><span class="pill ${ready?'':'warning'}">${ready?'✓ Recorded recipe ingredients ready':'⚠ Some recorded food missing'}</span></div><h3>Recorded ingredients</h3><ul class="modal-list">${ingredientRows}</ul>${r.extras.length?`<h3>From pantry / to check <small class="small-note">(${needed} to check or buy)</small></h3><ul class="modal-list">${extras}</ul><p class="foot-note">A ✓ means this staple is recorded in your kitchen. “Check” means the recipe needs something not yet fully tracked. Use + to add anything to your shopping list.</p>`:''}<h3>Let's cook</h3><ol class="steps">${r.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><div class="modal-actions">${r.original?`<button class="btn berry" onclick="saveInvented()">♡ Save this new recipe</button>`:`<button class="btn outline" onclick="toggleFav('${id}');openRecipe('${id}')">${state.favorites.includes(id)?'♥ Saved':'♡ Save'}</button><button class="btn outline" onclick="openPlanPicker(null,'${id}')">${icon('plus')} Meal plan</button>`}</div><button class="btn full ${ready?'':'ghost'}" ${ready?`onclick="cookRecipe('${id}')"`:'disabled'}>${ready?'✓ Cooked it · update recorded stock':'Not enough recorded ingredients'}</button><p class="foot-note">Cooking subtracts only the quantities specifically recorded in the recipe. Adjust other pantry items yourself after cooking. Always check dates and follow safe storage and cooking instructions.</p>`);
  }
  function cookRecipe(id){const r=id==='invented'?invented:RECIPES.find(x=>x.id===id);if(!r||!stockReady(r))return;if(!confirm(`Mark “${r.title}” as cooked and subtract its recorded recipe quantities?`))return;for(const [key,n] of r.ingredients){const need=requiredStock(r,key,n);if(need===null)return;state.stock[key]=Math.max(0,Math.round((stock(key)-need)*10000)/10000);}state.history.unshift({id,date:new Date().toISOString()});state.history=state.history.slice(0,50);const plannedIndex=state.plan.indexOf(id);if(plannedIndex!==-1)state.plan[plannedIndex]=null;save();closeModal();render();toast(`Enjoy! Ingredients used for ${r.title} ✓`);}

  function itemEditorData(id){return id?item(id):{id:'',name:'',qty:1,unit:'pieces',location:locationFilter==='All'?'Pantry':locationFilter,zone:'',emoji:'🧺',note:'',bestBefore:''};}
  function addItem(){editItem(null);}
  function unitOptions(current){let result='';for(const [label,units] of Object.entries(UNIT_GROUPS)){result+=`<optgroup label="${esc(label)}">${units.map(u=>`<option value="${esc(u)}" ${current===u?'selected':''}>${esc(u)}</option>`).join('')}</optgroup>`;}return result+`<option value="__custom__" ${!Object.values(UNIT_GROUPS).flat().includes(current)?'selected':''}>✍ Custom unit…</option>`;}
  function editItem(id){const i=itemEditorData(id);if(!i)return;editorIcon=i.emoji||'🧺';editorIconGroup='All';editorUnitDraft=i.unit;editorReferenceUnit=ORIGINAL_META[id]?.unit||null;const loc=locationOf(i),zone=zoneOptions(loc).includes(i.zone)?i.zone:zoneOptions(loc)[0];const preset=Object.values(UNIT_GROUPS).flat().includes(i.unit);const equivalent=Number(i.recipeEquiv)>0?Number(i.recipeEquiv):'';showModal(`<div class="eyebrow">PERSONALISE YOUR KITCHEN</div><h2>${id?'Edit food':'Add a food'}</h2><p>Choose an icon, your own units, and how much you actually have.</p><form class="stock-editor" onsubmit="event.preventDefault();saveItem('${id||''}')"><div class="food-icon-card"><div class="food-icon-preview" id="edit-emoji-preview" aria-label="Selected food icon">${esc(editorIcon)}</div><div class="icon-card-description"><b>Your food icon</b><small>Pick a symbol so you can spot ingredients quickly.</small><button type="button" class="btn sm outline" style="margin-top:8px" onclick="toggleIconGallery()">🎨 Choose icon</button></div></div><div class="icon-gallery" id="icon-gallery" hidden><input type="search" class="icon-search" id="icon-search" placeholder="Search icons: bread, coffee, cheese..." oninput="renderIconGallery()" aria-label="Search food icons"/><div class="icon-filter-row" id="icon-filters"></div><div class="icon-grid" id="icon-grid"></div><div class="field" style="margin-top:12px"><label for="edit-emoji-custom">Or use your own emoji or symbol</label><div class="inline-qty"><input type="text" id="edit-emoji-custom" placeholder="🍓" maxlength="24" autocomplete="off"/><button type="button" class="btn sm" onclick="useCustomIcon()">Use</button></div></div><p class="icon-help">Icons are kept with the item and included in your backups.</p></div><div class="field"><label for="edit-name">Food name</label><input id="edit-name" value="${esc(i.name)}" required maxlength="90" /></div><div class="field-row"><div class="field"><label for="edit-qty">How much?</label><input id="edit-qty" type="number" inputmode="decimal" step="any" min="0" max="100000" value="${i.qty}" required /></div><div class="field"><label for="edit-unit">Unit</label><select id="edit-unit" onchange="onEditorUnitChange(this.value)">${unitOptions(i.unit)}</select></div></div><div class="field" id="custom-unit-row" ${preset?'hidden':''}><label for="edit-unit-custom">Your custom unit</label><input id="edit-unit-custom" value="${preset?'':esc(i.unit)}" placeholder="e.g. scoops, handfuls, trays" maxlength="28" onblur="commitCustomUnit()"/><p class="unit-help">Type any unit you prefer. It also appears on the stock list.</p></div><div class="field-row" style="margin-top:10px"><div class="field"><label for="edit-step">+ / − button changes by</label><input id="edit-step" type="number" inputmode="decimal" min="0.0001" step="any" max="100000" value="${Number(i.step)>0?i.step:unitDefaultStep(i.unit)}" required/></div><div class="field" style="justify-content:center"><span class="unit-help">For example, 50 g, 0.25 litres or 1 scoop each tap.</span></div></div><div id="equiv-row" class="field" hidden style="margin-top:10px"><label for="edit-equiv" id="equiv-label">Recipe equivalent</label><input id="edit-equiv" type="number" step="any" inputmode="decimal" min="0.00001" max="100000" value="${equivalent}" placeholder="e.g. 0.5"/><p class="unit-warning" id="equiv-help">Optional, but recipes can't reliably subtract this item without a conversion.</p></div><div class="field-row" style="margin-top:12px"><div class="field"><label for="edit-location">Stored in</label><select id="edit-location" onchange="refreshZoneOptions(this.value)">${LOCATIONS.map(l=>`<option value="${l}" ${loc===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="edit-zone">Category</label><select id="edit-zone">${zoneOptions(loc).map(z=>`<option value="${esc(z)}" ${zone===z?'selected':''}>${esc(z)}</option>`).join('')}</select></div></div><div class="field"><label for="edit-date">Use-by / best-before (optional)</label><input type="date" id="edit-date" value="${esc(i.bestBefore||'')}" /><div class="small-note">A reminder to check the label, not automatic food-safety advice.</div></div><div class="field"><label for="edit-note">Notes (optional)</label><textarea id="edit-note" maxlength="250">${esc(i.note)}</textarea></div><button class="btn full" type="submit">Save food ${icon('check')}</button>${id&&state.custom.some(x=>x.id===id)?`<button class="btn outline full" type="button" onclick="deleteItem('${id}')">Remove this food</button>`:''}</form>`);refreshRecipeEquivalence();}
  function refreshZoneOptions(loc){const el=document.getElementById('edit-zone');el.innerHTML=zoneOptions(loc).map(z=>`<option value="${esc(z)}">${esc(z)}</option>`).join('');}
  function getEditorUnit(){const sel=document.getElementById('edit-unit');return sel.value==='__custom__'?document.getElementById('edit-unit-custom').value.trim():sel.value;}
  function onEditorUnitChange(value){const custom=document.getElementById('custom-unit-row');custom.hidden=value!=='__custom__';if(value==='__custom__'){document.getElementById('edit-unit-custom').focus();refreshRecipeEquivalence();return;}changeEditorUnit(value);}
  function commitCustomUnit(){const value=getEditorUnit();if(value)changeEditorUnit(value);}
  function changeEditorUnit(next){const prev=editorUnitDraft;if(prev===next){refreshRecipeEquivalence();return;}const qty=document.getElementById('edit-qty'),step=document.getElementById('edit-step');const updated=convertUnits(Number(qty.value),prev,next),newStep=convertUnits(Number(step.value),prev,next);if(updated!==null){qty.value=prettyNumber(updated);step.value=prettyNumber(newStep);}else{step.value=unitDefaultStep(next);}editorUnitDraft=next;refreshRecipeEquivalence();}
  function refreshRecipeEquivalence(){const wrap=document.getElementById('equiv-row');if(!wrap)return;const unit=getEditorUnit();const base=editorReferenceUnit;const incompar=!!base&&!!unit&&convertUnits(1,base,unit)===null;wrap.hidden=!incompar;if(incompar){document.getElementById('equiv-label').textContent=`For recipes: 1 ${unit} = how many ${base}?`;document.getElementById('equiv-help').textContent=`Optional: enter the original quantity in ${base} that one ${unit} represents. Leave blank to avoid inaccurate recipe deductions.`;}}
  function toggleIconGallery(){const el=document.getElementById('icon-gallery');el.hidden=!el.hidden;if(!el.hidden){renderIconGallery();document.getElementById('icon-search').focus();}}
  function filterIconGroup(group){editorIconGroup=group;renderIconGallery();}
  function renderIconGallery(){const grid=document.getElementById('icon-grid'),filters=document.getElementById('icon-filters');if(!grid||!filters)return;const q=(document.getElementById('icon-search')?.value||'').toLowerCase().trim();const groups=['All',...Object.keys(ICON_GROUPS)];filters.innerHTML=groups.map((g,idx)=>`<button type="button" class="icon-filter ${editorIconGroup===g?'active':''}" onclick="filterIconGroup(${JSON.stringify(g).replace(/"/g,"&quot;")})">${esc(g)}</button>`).join('');let html='';for(const [group,icons] of Object.entries(ICON_GROUPS)){if(editorIconGroup!=='All'&&editorIconGroup!==group)continue;icons.forEach(([symbol,name],i)=>{if(q&&!(group+' '+name+' '+symbol).toLowerCase().includes(q))return;html+=`<button type="button" class="icon-choice ${editorIcon===symbol?'selected':''}" aria-label="${esc(name)}" aria-pressed="${editorIcon===symbol?'true':'false'}" title="${esc(name)}" onclick="setGalleryIcon(${JSON.stringify(group).replace(/"/g,"&quot;")},${i})">${esc(symbol)}</button>`;});}grid.innerHTML=html||'<p class="small-note">No icons found. Try another search or use your own symbol.</p>';}
  function setGalleryIcon(group,index){const match=ICON_GROUPS[group]?.[index];if(!match)return;editorIcon=match[0];document.getElementById('edit-emoji-preview').textContent=editorIcon;renderIconGallery();}
  function useCustomIcon(){const input=document.getElementById('edit-emoji-custom');const symbol=input.value.trim();if(!symbol||Array.from(symbol).length>12)return toast('Choose a short emoji or symbol.');editorIcon=symbol;document.getElementById('edit-emoji-preview').textContent=editorIcon;renderIconGallery();input.value='';}
  function saveItem(id){const name=document.getElementById('edit-name').value.trim(),qty=Number(document.getElementById('edit-qty').value),unit=getEditorUnit(),step=Number(document.getElementById('edit-step').value),location=document.getElementById('edit-location').value,zone=document.getElementById('edit-zone').value,note=document.getElementById('edit-note').value.trim(),bestBefore=document.getElementById('edit-date').value,emoji=editorIcon;const rawEquiv=document.getElementById('edit-equiv')?.value||'';const recipeEquiv=!document.getElementById('equiv-row').hidden&&rawEquiv?Number(rawEquiv):null;
    if(!name||!Number.isFinite(qty)||qty<0||qty>100000||!unit||Array.from(unit).length>28||!Number.isFinite(step)||step<=0||step>100000||!LOCATIONS.includes(location)||!zoneOptions(location).includes(zone)||!emoji||Array.from(emoji).length>12)return toast('Check the food details and amounts.');
    if(rawEquiv&&(!Number.isFinite(recipeEquiv)||recipeEquiv<=0||recipeEquiv>100000))return toast('Check the recipe conversion amount.');
    if(!id){id='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);state.custom.push({id,name,qty,unit,step,location,zone,emoji,note,bestBefore,recipeEquiv:null});}
    else{const target=state.custom.find(x=>x.id===id)||BASE_ITEMS.find(x=>x.id===id);if(!target)return;const meta={name,unit,step,location,zone,note,bestBefore,emoji,recipeEquiv};if(state.custom.find(x=>x.id===id)){Object.assign(target,meta);}else{state.meta=state.meta||{};state.meta[id]=meta;Object.assign(target,meta);}}
    state.stock[id]=Math.round(qty*10000)/10000;save();closeModal();render();toast('Food and icon saved ✓');
  }
  function deleteItem(id){if(!confirm('Remove this custom ingredient permanently?'))return;state.custom=state.custom.filter(x=>x.id!==id);delete state.stock[id];save();closeModal();render();toast('Ingredient removed');}
  function openManage(){showModal(`<div class="eyebrow">YOUR KITCHEN, YOUR DATA</div><h2>Household, updates & backup</h2><p>Your fridge, freezer and pantry can be shared with your household after you import your food. Recipes, favourites and meal plans stay on this phone.</p><div class="settings-grid"><button class="manage-btn" onclick="openHousehold()"><span>☁️</span>Shared household</button><button class="manage-btn" onclick="checkAppUpdates()"><span>🔄</span>Check for updates</button><button class="manage-btn" onclick="openShopping()"><span>🛒</span>Shopping list</button><button class="manage-btn" onclick="exportData()"><span>📤</span>Export backup</button><button class="manage-btn" onclick="document.getElementById('import-input').click()"><span>📥</span>Import backup file</button><button class="manage-btn" onclick="showPasteBackup()"><span>📝</span>Paste backup text</button><button class="manage-btn" onclick="showCopyBackup()"><span>📋</span>Copy backup text</button></div><h3>Moving to a new phone</h3><p>Transfer the JSON file (or copy the backup text) then import it. Backups from the first freezer-only version are supported, too.</p><div class="rule"></div><h3>Starting over</h3><button class="btn outline full" onclick="resetData()">Restore original freezer and empty pantry</button><p class="foot-note">Resetting clears your changes and favourites. Export first.</p>`);}
  function exportData(){const blob=new Blob([JSON.stringify({app:'NikolasKitchen',version:3,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nikolas-kitchen-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Backup prepared ✓');}
  function showCopyBackup(){const raw=JSON.stringify({app:'NikolasKitchen',version:3,data:state});showModal(`<div class="eyebrow">PORTABLE BACKUP</div><h2>Copy your kitchen data</h2><p>Select all and copy this text if downloading files does not work on your phone.</p><textarea id="backup-text" class="backup-text" readonly>${esc(raw)}</textarea><button class="btn full" onclick="copyBackup()">📋 Select & copy backup</button><p class="foot-note">Keep this somewhere private; it contains your entire kitchen inventory.</p>`);}
  function copyBackup(){const t=document.getElementById('backup-text');if(!t)return;t.focus();t.select();t.setSelectionRange(0,t.value.length);try{const ok=document.execCommand('copy');toast(ok?'Copied to clipboard ✓':'Text selected — use Copy');}catch(e){toast('Text selected — use Copy');}}
  function importKitchenData(parsed){if(window.NKCloud?.isSharing()){toast('Disconnect shared shopping before importing a full backup.');return false;}const data=parsed?.app==='NikolasKitchen'?parsed.data:parsed;if(!data||typeof data.stock!=='object'||Array.isArray(data.stock)||!data.stock)throw Error('Invalid backup');if(!confirm('Import this backup? It will replace the inventory and plans saved in this app.'))return false;
    const next=freshState();for(const [k,v] of Object.entries(data.stock)){if(typeof k==='string'&&k.length<150&&typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100000)next.stock[k]=v;}
    next.custom=Array.isArray(data.custom)?data.custom.filter(x=>x&&typeof x.id==='string'&&x.id.startsWith('custom_')&&typeof x.name==='string'&&x.name.length<=90&&typeof x.unit==='string').slice(0,500).map(x=>({...x,location:locationOf(x),zone:zoneOptions(locationOf(x)).includes(x.zone)?x.zone:zoneOptions(locationOf(x))[0],emoji:typeof x.emoji==='string'&&Array.from(x.emoji).length<=12?x.emoji:'🧺',step:Number(x.step)>0?Number(x.step):unitDefaultStep(x.unit),recipeEquiv:Number(x.recipeEquiv)>0?Number(x.recipeEquiv):null,bestBefore:x.bestBefore||''})):[];
    next.favorites=Array.isArray(data.favorites)?data.favorites.filter(id=>RECIPES.some(r=>r.id===id)):[];
    next.plan=Array.isArray(data.plan)&&data.plan.length===7?data.plan.map(id=>RECIPES.some(r=>r.id===id)?id:null):Array(7).fill(null);
    next.history=Array.isArray(data.history)?data.history.slice(0,50):[];
    next.creations=Array.isArray(data.creations)?data.creations.slice(0,150):[];
    next.meta=data.meta&&typeof data.meta==='object'&&!Array.isArray(data.meta)?data.meta:{};
    next.shopping=Array.isArray(data.shopping)?data.shopping.filter(x=>x&&typeof x.text==='string').slice(0,150):[];
    state=next;syncCreations();applyMeta();save();closeModal();render();toast('Kitchen backup imported ✓');return true;
  }
  document.getElementById('import-input').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{importKitchenData(JSON.parse(await f.text()));}catch(err){toast('That file is not a valid kitchen backup.');}});
  function showPasteBackup(){showModal(`<div class="eyebrow">RESTORE KITCHEN DATA</div><h2>Paste a backup</h2><p>Paste text from another copy of Nikola's Kitchen. This supports both the original freezer app and this whole-kitchen version.</p><textarea id="paste-backup" class="backup-text" placeholder="Paste backup JSON text here"></textarea><button class="btn full" onclick="importPastedBackup()">Import pasted backup</button>`);}
  function importPastedBackup(){try{importKitchenData(JSON.parse(document.getElementById('paste-backup').value));}catch(e){toast("Please paste a valid Nikola's Kitchen backup.");}}


  function addShoppingExtra(recipeId,index){const r=recipeId==='invented'?invented:RECIPES.find(r=>r.id===recipeId);const raw=r?.extras?.[index];if(raw)addShoppingItem(raw);}
  function addShoppingItem(text){const raw=String(text||'').trim().slice(0,120);if(!raw)return;state.shopping=state.shopping||[];if(!state.shopping.some(x=>x.text.toLowerCase()===raw.toLowerCase()&&!x.done)){const entry={id:'shop_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),text:raw,done:false};state.shopping.push(entry);window.NKCloud?.mutate({type:'put',item:entry});}save();toast('Added to shopping list 🛒');}
  function quickAddShopping(){const inp=document.getElementById('shopping-new'),raw=inp?.value?.trim();if(!raw)return;addShoppingItem(raw);openShopping();}
  function toggleShopping(id){const x=(state.shopping||[]).find(x=>x.id===id);if(!x)return;x.done=!x.done;window.NKCloud?.mutate({type:'put',item:{...x}});save();openShopping();}
  function deleteShopping(id){state.shopping=state.shopping.filter(x=>x.id!==id);window.NKCloud?.mutate({type:'delete',id});save();openShopping();}
  function clearCheckedShopping(){const removed=state.shopping.filter(x=>x.done).map(x=>x.id);state.shopping=state.shopping.filter(x=>!x.done);for(const id of removed)window.NKCloud?.mutate({type:'delete',id});save();openShopping();}
  function openShopping(){const entries=state.shopping||[];showModal(`<div class="eyebrow">NEXT GROCERY TRIP</div><h2>Shopping list 🛒</h2><p>Anything missing from recipes can be saved here. Tick off items as you shop, then add them to your kitchen stock.</p><div class="cloud-status" id="shop-cloud-status" onclick="openHousehold()" role="button" tabindex="0">${window.NKCloud?.statusText()||'☁️ Local shopping list · Tap to set up sharing'} <span style="margin-left:auto">›</span></div><div class="field-row" style="grid-template-columns:1fr auto"><input id="shopping-new" style="min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px" placeholder="Add milk, eggs..." onkeydown="if(event.key==='Enter')quickAddShopping()"/><button class="btn" onclick="quickAddShopping()">Add</button></div><div class="shopping-list">${entries.map(x=>`<div class="shopping-row"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShopping('${x.id}')"/><span class="${x.done?'done':''}">${esc(x.text)}</span><button class="mini-action" onclick="deleteShopping('${x.id}')" aria-label="Remove">×</button></div>`).join('')||'<div class="empty">Your list is empty. Open a recipe to add ingredients.</div>'}</div>${entries.some(x=>x.done)?'<button class="btn outline full" onclick="clearCheckedShopping()">Remove checked items</button>':''}<button class="btn full outline" onclick="openEssentials()">+ Add bought food to kitchen</button>`);window.NK_SHOPPING_OPEN=true;}

  function resetData(){if(window.NKCloud?.isSharing()){toast('Leave the shared household before resetting the local shopping list.');return;}if(!confirm('Restore the original freezer inventory and clear added food, shopping and favourites?'))return;state=freshState();syncCreations();resetMeta();save();closeModal();render();toast('Kitchen reset to original stock');}
  // Apply saved edits to the bundled inventory. These edits remain private to this browser.
  const ORIGINAL_META=Object.fromEntries(BASE_ITEMS.map(i=>[i.id,{name:i.name,unit:i.unit,location:i.location,zone:i.zone,note:i.note,bestBefore:i.bestBefore,emoji:i.emoji,step:i.step||unitDefaultStep(i.unit),recipeEquiv:null}]));
  function resetMeta(){for(const i of BASE_ITEMS)Object.assign(i,ORIGINAL_META[i.id]);}
  function applyMeta(){resetMeta();if(!state.meta)return;for(const i of BASE_ITEMS){const m=state.meta[i.id];if(m&&typeof m==='object'){if(typeof m.name==='string'&&m.name.length<100)i.name=m.name;if(typeof m.unit==='string')i.unit=m.unit;if(LOCATIONS.includes(m.location))i.location=m.location;const loc=locationOf(i);if(zoneOptions(loc).includes(m.zone))i.zone=m.zone;if(typeof m.note==='string')i.note=m.note;if(typeof m.bestBefore==='string')i.bestBefore=m.bestBefore;if(typeof m.emoji==='string'&&Array.from(m.emoji).length<=12)i.emoji=m.emoji;if(Number.isFinite(m.step)&&m.step>0)i.step=m.step;i.recipeEquiv=Number.isFinite(m.recipeEquiv)&&m.recipeEquiv>0?m.recipeEquiv:null;}}}
  applyMeta();render();
  window.NKHost={
    getShopping:()=>[...(state.shopping||[])],
    setShopping:(entries)=>{state.shopping=entries.slice(0,250);save();if(window.NK_SHOPPING_OPEN)openShopping();},
    getInventory:()=>inventoryCopy(),
    setInventory:(shared)=>{
      if(!shared||typeof shared.stock!=='object'||!Array.isArray(shared.custom)||typeof shared.meta!=='object')return;
      const safeStock={};
      for(const [id,q] of Object.entries(shared.stock)){
        if(typeof id==='string'&&id.length<150&&typeof q==='number'&&Number.isFinite(q)&&q>=0&&q<=100000)safeStock[id]=q;
      }
      state.stock=safeStock;
      state.custom=shared.custom.filter(x=>x&&typeof x.id==='string'&&x.id.startsWith('custom_')&&typeof x.name==='string'&&typeof x.unit==='string').slice(0,500);
      state.meta=shared.meta;
      applyMeta();
      lastInventory=inventoryCopy(); // Remote changes must not be uploaded again.
      save();render();
    }
  };
  function openHousehold(){if(!window.NKCloud){toast('Cloud settings are loading.');return;}window.NKCloud.open();}
  async function checkAppUpdates(){showModal(`<div class="eyebrow">NIKOLA'S KITCHEN</div><h2>App updates</h2><p>Checking GitHub for a newer signed Android release…</p>`);try{const r=await fetch('https://api.github.com/repos/evanmurphy18-wq/nikolas-kitchen-android/releases/latest',{cache:'no-store'});if(!r.ok)throw Error(r.status===404?'No published Android release yet.':'GitHub is unavailable.');const d=await r.json(),apk=(d.assets||[]).find(a=>a.name.endsWith('.apk'));const ver=String(d.tag_name||'').replace(/^v/,'');const newer=ver.localeCompare('4.2.0',undefined,{numeric:true})>0;showModal(`<div class="eyebrow">NIKOLA'S KITCHEN</div><h2>${newer?'Update available':'App updates'}</h2><p>${esc(d.name||d.tag_name)} · ${newer?'A newer version is available.':'This is the current major version.'}</p><p>Android will ask you to approve any APK installation. Existing data is preserved only when the update uses the same app ID and signing key.</p>${apk?`<button class="btn full" onclick="openReleaseUrl('${esc(apk.browser_download_url)}')">Get APK ${icon('arrow')}</button>`:''}`);}catch(e){showModal(`<h2>App updates</h2><p>${esc(e.message||'Unable to check for updates.')}</p><button class="btn outline full" onclick="openReleaseUrl('https://github.com/evanmurphy18-wq/nikolas-kitchen-android/releases')">View releases</button>`);}}
  function openReleaseUrl(url){if(!/^https:\/\/github\.com\//.test(url))return;window.open(url,'_blank','noopener,noreferrer');}
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  </script>
  <script src="cloud-config.js"></script>
  <script defer src="cloud.bundle.js"></script>
